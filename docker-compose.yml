version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kai3d_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kai3d
      POSTGRES_PASSWORD: kai3d_dev
      POSTGRES_DB: kai3d
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kai3d -d kai3d']
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kai3d_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kai3d.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
